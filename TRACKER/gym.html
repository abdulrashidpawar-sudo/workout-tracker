<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Workout Tracker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: white;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #b3b3b3;
      margin-bottom: 30px;
    }

    .card {
      background-color: #1a1a1a;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background-color: #2a2a2a;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .workout {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .workout h3 {
      margin-bottom: 10px;
    }

    .delete-btn {
      margin-top: 10px;
      background-color: crimson;
      color: white;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gym Workout Tracker</h1>
    <p>Track your workouts, sets, reps, and weights.</p>

    <div class="card">
      <h2>Add Workout</h2>

      <input type="text" id="exercise" placeholder="Exercise Name" />
      <input type="number" id="sets" placeholder="Sets" />
      <input type="number" id="reps" placeholder="Reps" />
      <input type="number" id="weight" placeholder="Weight (kg)" />

      <button onclick="addWorkout()">Save Workout</button>
    </div>

    <div class="card">
      <h2>Workout History</h2>

      <div id="workout-list">
        <div class="empty">No workouts added yet.</div>
      </div>
    </div>
  </div>

  <script>
    let workouts = JSON.parse(localStorage.getItem("workouts")) || [];

    function displayWorkouts() {
      const workoutList = document.getElementById("workout-list");

      if (workouts.length === 0) {
        workoutList.innerHTML = '<div class="empty">No workouts added yet.</div>';
        return;
      }

      workoutList.innerHTML = "";

      workouts.forEach((workout, index) => {
        workoutList.innerHTML += `
          <div class="workout">
            <h3>${workout.exercise}</h3>
            <p>Sets: ${workout.sets}</p>
            <p>Reps: ${workout.reps}</p>
            <p>Weight: ${workout.weight} kg</p>
            <button class="delete-btn" onclick="deleteWorkout(${index})">Delete</button>
          </div>
        `;
      });
    }

    function addWorkout() {
      const exercise = document.getElementById("exercise").value;
      const sets = document.getElementById("sets").value;
      const reps = document.getElementById("reps").value;
      const weight = document.getElementById("weight").value;

      if (exercise === "" || sets === "" || reps === "") {
        alert("Please fill all required fields");
        return;
      }

      const workout = {
        exercise,
        sets,
        reps,
        weight
      };

      workouts.unshift(workout);

      localStorage.setItem("workouts", JSON.stringify(workouts));

      document.getElementById("exercise").value = "";
      document.getElementById("sets").value = "";
      document.getElementById("reps").value = "";
      document.getElementById("weight").value = "";

      displayWorkouts();
    }

    function deleteWorkout(index) {
      workouts.splice(index, 1);
      localStorage.setItem("workouts", JSON.stringify(workouts));
      displayWorkouts();
    }

    displayWorkouts();
  </script>

</body>
</html>
